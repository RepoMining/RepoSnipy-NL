[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposnipy-nl"
version = "0.3.0"
description = "Natural-language repository retrieval for the RepoSnipy ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<2",
]

[project.optional-dependencies]
api = [
    "accelerate==0.34.2",
    "docarray==0.40.0",
    "fastapi==0.141.1",
    "torch==2.2.2",
    "transformers==4.46.3",
    "uvicorn[standard]==0.53.0",
]

[tool.setuptools.packages.find]
where = ["src"]
