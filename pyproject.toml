[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposnipy-nl"
version = "0.2.0"
description = "Natural-language repository retrieval for the RepoSnipy ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
